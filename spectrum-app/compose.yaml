services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: spectrum
      POSTGRES_USER: spectrum
      POSTGRES_PASSWORD: spectrum
    ports:
      - "5433:5432"
    volumes:
      - spectrum-postgres-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectrum -d spectrum"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  spectrum-postgres-data-v18:
