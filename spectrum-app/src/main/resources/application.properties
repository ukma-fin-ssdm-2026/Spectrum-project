quarkus.swagger-ui.path=/api-docs
quarkus.smallrye-openapi.path=/api-docs/openapi

quarkus.http.access-log.enabled=true
quarkus.smallrye-openapi.store-schema-directory=../docs/api

smallrye.jwt.verify.secretkey=${JWT_SECRET}
smallrye.jwt.verify.algorithm=HS256
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=access_token
