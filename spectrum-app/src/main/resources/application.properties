quarkus.swagger-ui.path=/api-docs
quarkus.smallrye-openapi.path=/api-docs/openapi

quarkus.http.access-log.enabled=true
quarkus.smallrye-openapi.store-schema-directory=../docs/api

quarkus.datasource.devservices.enabled=false
quarkus.devservices.enabled=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

# The built-in database readiness check runs this query at /q/health/ready.
quarkus.datasource.jdbc.validation-query-sql=SELECT 1
quarkus.datasource.jdbc.validation-query-timeout=PT5S

quarkus.flyway.migrate-at-start=true

# Application configuration (AppConfig and its injectable nested records).
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=spectrum-app
app.jwt.token-lifetime=PT15M

app.db.query-timeout-seconds=5
app.db.transaction-timeout=PT10S
app.db.retry.max-retries=3
app.db.retry.delay-millis=200
app.db.retry.jitter-millis=100
app.db.retry.backoff-factor=2
app.db.retry.max-delay-millis=1000

# Retry annotations use the same settings as AppConfig.DbConfig.retry().
Retry/maxRetries=${app.db.retry.max-retries}
Retry/delay=${app.db.retry.delay-millis}
Retry/jitter=${app.db.retry.jitter-millis}
quarkus.fault-tolerance.{*}.exponential-backoff.max-delay=${app.db.retry.max-delay-millis}
quarkus.fault-tolerance.{*}.exponential-backoff.factor=${app.db.retry.backoff-factor}

# JWT verification (HS256 secret, issuer, cookie) is configured in JwtVerificationProducer.
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=access_token
