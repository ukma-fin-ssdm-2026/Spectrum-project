name: Spotbugs check

on:
  pull_request:
    types: [ opened, synchronize ]
    branches:
      - main

jobs:
  spotbugs:
    runs-on: [self-hosted, linux]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: spectrum
          POSTGRES_USER: spectrum
          POSTGRES_PASSWORD: spectrum
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U spectrum -d spectrum"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Permissions for mvnw
        working-directory: spectrum-app
        run: chmod +x mvnw
      - name: Perform static analysis
        working-directory: spectrum-app
        run: ./mvnw -B -DskipTests compile spotbugs:check
