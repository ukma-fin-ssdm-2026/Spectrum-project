name: Generate and Deploy API Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/api/**'

jobs:
  generate-and-deploy:
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/api