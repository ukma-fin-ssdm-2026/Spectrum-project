name: Generate OpenAPI Spec on PR

on:
  pull_request:
    types: [ opened, synchronize ]
    branches:
      - main

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Head Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Generate OpenAPI
        run: ./spectrum-app/mvnw -f spectrum-app/pom.xml clean package -DskipTests

      - name: Commit and Push OpenAPI Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git add docs/api/openapi.json
          
          if git diff --staged --quiet; then
            echo "No changes to OpenAPI specification files."
          else
            git commit -m "chore: auto-generate openapi specification [skip ci]"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi