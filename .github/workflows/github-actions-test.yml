name: CI Test
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Permissions for mvnw
        working-directory: spectrum-app
        run: chmod +x mvnw
      - name: Run tests with coverage minimum
        working-directory: spectrum-app
        run: ./mvnw -B verify